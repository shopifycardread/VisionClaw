name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build IPA with Shared DerivedData
        run: |
          # Navigate into project directory
          TARGET_DIR=$(find . -name "*.xcodeproj" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            TARGET_ARG="-workspace $WORKSPACE"
          else
            TARGET_ARG="-project $PROJECT"
          fi

          SCHEME="CameraAccess"
          DERIVED_DATA_PATH="$(pwd)/DerivedData"

          # 1. Resolve SPM binary dependencies into explicit DerivedData
          xcodebuild -resolvePackageDependencies \
            $TARGET_ARG \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH"

          # 2. Build using identical DerivedData path so LiveKitUniFFI & SwiftProtobuf modules resolve
          xcodebuild build \
            $TARGET_ARG \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          # 3. Package output from DerivedData into IPA
          mkdir -p Payload
          cp -r "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos/"*.app Payload/
          zip -r VisionClaw.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-IPA
          path: "**/VisionClaw.ipa"
