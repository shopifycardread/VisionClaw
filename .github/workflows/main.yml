name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build Unsigned IPA
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          cd "$PROJ_DIR"
          
          SCHEME=$(xcodebuild -list -project *.xcodeproj | grep -A 5 "Schemes:" | tail -n +2 | head -n 1 | xargs)
          
          xcodebuild build \
            -project *.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build

          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r VisionClaw.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-IPA
          path: "**/VisionClaw.ipa"
