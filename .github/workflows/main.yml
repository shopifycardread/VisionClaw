name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build IPA with Recursive Path Resolution
        run: |
          # Search entire repository recursively for project or workspace files
          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/.*" -not -path "*/build/*" | head -n 1)
          PROJECT=$(find . -name "*.xcodeproj" -not -path "*/.*" -not -path "*/build/*" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            TARGET_ARG="-workspace $WORKSPACE"
            echo "Using workspace: $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            TARGET_ARG="-project $PROJECT"
            echo "Using project: $PROJECT"
          else
            echo "::error::No .xcworkspace or .xcodeproj file found in the repository."
            exit 1
          fi

          SCHEME="CameraAccess"

          # Resolve dependencies specifically for iOS platform target
          xcodebuild -resolvePackageDependencies \
            $TARGET_ARG \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release

          # Build binary using Ad-Hoc code signing
          xcodebuild build \
            $TARGET_ARG \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            BUILD_DIR=build

          # Package into IPA
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r VisionClaw.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-IPA
          path: VisionClaw.ipa
