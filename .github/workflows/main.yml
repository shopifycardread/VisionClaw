name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Generate Secrets.swift
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXAMPLE_FILE=$(find . -name "Secrets.swift.example" | head -n 1)

          if [ -n "$EXAMPLE_FILE" ]; then
            SECRETS_FILE="$(dirname "$EXAMPLE_FILE")/Secrets.swift"
            cp "$EXAMPLE_FILE" "$SECRETS_FILE"
            if [ -n "$GEMINI_API_KEY" ]; then
              sed -i '' "s/YOUR_GEMINI_API_KEY/$GEMINI_API_KEY/g" "$SECRETS_FILE" || true
            fi
            echo "Successfully created Secrets.swift from template."
          else
            TARGET_DIR=$(find . -name "*.xcodeproj" -not -path "*/.*" -exec dirname {} \; | head -n 1)
            SECRETS_DIR="$(dirname "$TARGET_DIR")/CameraAccess"
            mkdir -p "$SECRETS_DIR"
            
            echo 'import Foundation' > "$SECRETS_DIR/Secrets.swift"
            echo '' >> "$SECRETS_DIR/Secrets.swift"
            echo 'struct Secrets {' >> "$SECRETS_DIR/Secrets.swift"
            echo '    static let geminiApiKey = ""' >> "$SECRETS_DIR/Secrets.swift"
            echo '}' >> "$SECRETS_DIR/Secrets.swift"
            
            echo "Generated fallback Secrets.swift file."
          fi

      - name: Build IPA with Shared DerivedData
        run: |
          TARGET_DIR=$(find . -name "*.xcodeproj" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            TARGET_ARG="-workspace $WORKSPACE"
          else
            TARGET_ARG="-project $PROJECT"
          fi

          SCHEME="CameraAccess"
          DERIVED_DATA_PATH="$(pwd)/DerivedData"

          xcodebuild -resolvePackageDependencies \
            $TARGET_ARG \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH"

          xcodebuild build \
            $TARGET_ARG \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p Payload
          cp -r "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos/"*.app Payload/
          zip -r VisionClaw.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-IPA
          path: "**/VisionClaw.ipa"
