name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build IPA with Ad-Hoc Signing
        run: |
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            TARGET_ARG="-workspace $WORKSPACE"
          else
            TARGET_ARG="-project $PROJECT"
          fi

          SCHEME="CameraAccess"

          # Resolve dependencies
          xcodebuild -resolvePackageDependencies $TARGET_ARG -scheme "$SCHEME"

          # Build using Ad-Hoc signing so LiveKit and SPM dependencies compile successfully
          xcodebuild build \
            $TARGET_ARG \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            BUILD_DIR=build

          # Package compiled app binary into IPA
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r VisionClaw.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-IPA
          path: VisionClaw.ipa
